[workspace]
authors = ["ben <ben.uzh@proton.me>"]
channels = ["conda-forge"]
name = "brisc"
platforms = ["linux-64", "osx-arm64"]
version = "0.1.0"

[tasks]
check = "python check.py"
test = "python tests/test_module.py"
export-env = "pixi workspace export conda-environment --name brisc envs/brisc.yml && sed -i '1s/^/# this file was auto-generated by pixi - do not edit by hand\\n/' envs/brisc.yml"

[dependencies]
python = ">=3.13,<3.14"
h5py = ">=3.16,<4"
numpy = ">=2,<3"
scipy = ">=1.16,<2"
polars = ">=1.43,<2"

# PyPI wheel, not the conda-forge build: that one hard-depends on r-seurat
# (the whole R stack) for the Seurat converters, which no entrypoint here uses.
[pypi-dependencies]
brisc = "==0.2.5"
